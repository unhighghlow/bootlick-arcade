<!DOCTYPE html>

<link rel="stylesheet" href="game.css">
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta charset="utf-8">

<body><div class="game-body">
  <main id="game" class="stage" aria-label="Rio Run playfield" style="touch-action: none;"></main>
  <footer class="game-bar">
    <button id="sound" class="toggle" type="button" aria-pressed="true">
      <span class="toggle-icon" aria-hidden="true">♪</span>
      <span class="toggle-text">Sound on</span>
    </button>
    <span class="hint">arrows or WASD to steer · M mute · R restart</span>


  </footer>

  <div class="mobile-pad" aria-hidden="true">
    <button type="button" class="up" data-key="ArrowUp">▲</button>
    <button type="button" class="left" data-key="ArrowLeft">◀</button>
    <button type="button" class="right" data-key="ArrowRight">▶</button>
    <button type="button" class="down" data-key="ArrowDown">▼</button>
  </div>
</div></body>

<script src="game.js"></script>
