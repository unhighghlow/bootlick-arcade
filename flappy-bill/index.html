<!DOCTYPE html>

<link rel="stylesheet" href="game.css">
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta charset="utf-8">

<body><div class="game-body">
  <main id="game" class="stage" aria-label="Flappy Bill playfield" style="touch-action: none;"></main>
  <footer class="game-bar">
    <button id="sound" class="toggle" type="button" aria-pressed="true">
      <span class="toggle-icon" aria-hidden="true">♪</span>
      <span class="toggle-text">Sound on</span>
    </button>
    <span class="hint">click or space to flap · M mute · R restart</span>
    <a class="brand" href="https://www.whitehouse.gov/" rel="noopener">
      <span class="brand-mark" aria-hidden="true">★</span>
      <span class="brand-text">Trump Accounts</span>
    </a>
  </footer>
</div></body>

<script src="game.js"></script>
