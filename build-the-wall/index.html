<!DOCTYPE html>

<link rel="stylesheet" href="game.css">
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta charset="utf-8">

<body><div class="game-wrapper">
  <div class="cabinet">
    <div class="screen-wrap">
      <canvas id="game" width="900" height="650"></canvas>
      <div class="scanlines"></div>
      <div class="vignette"></div>
      <div class="crt-flicker"></div>
    </div>
    <div class="controls">
      <span class="key">←→</span> MOVE
      <span class="key">↑</span> ROTATE
      <span class="key">↓</span> SOFT DROP
      <span class="key">SPACE</span> SLAM
      <span class="key">P</span> PAUSE
      <span class="key">M</span> MUTE
    </div>

    <div class="controls touch-controls">
      <span class="key">DRAG</span> MOVE
      <span class="key">TAP</span> ROTATE
      <span class="key">FLICK ↓</span> SLAM
    </div>
    <div class="footer-tag">★ INSERT COIN ★ ZOMBIE BORDER SIEGE ★ INSERT COIN ★</div>
  </div>
</div></body>

<script src="game.js"></script>
