<!DOCTYPE html>

<link rel="stylesheet" href="game.css">
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta charset="utf-8">

<body><div class="game-body">
  <main id="game" class="stage" aria-label="Supply Line playfield"></main>
  <footer class="game-bar">
    <button id="sound" class="toggle" type="button" aria-pressed="true">
      <span class="toggle-icon" aria-hidden="true">♪</span>
      <span class="toggle-text">Sound on</span>
    </button>
    <span class="hint">click or arrows + space to knock it off · let clean food ride · M mute
      · R restart</span>
  </footer>
</div></body>

<script src="game.js"></script>
